name: Bid announcement alerts

on:
  schedule:
    # 09:17 Asia/Shanghai = 01:17 UTC. Avoid the busy top-of-hour scheduler window.
    - cron: "17 1 * * *"
    # 17:47 Asia/Shanghai = 09:47 UTC. Leave room for the broader daily scan.
    - cron: "47 9 * * *"
    # Temporary no-email schedule checks on 2026-10-30; remove after verification.
    - cron: "59 5 30 10 *"
    - cron: "9 6 30 10 *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "scan"
        type: choice
        options:
          - scan
          - dry-run
          - test-email
          - prime

concurrency:
  group: ${{ (github.event_name == 'schedule' && (github.event.schedule == '59 5 30 10 *' || github.event.schedule == '9 6 30 10 *')) && 'bid-alert-schedule-probe-20261030' || 'bid-announcement-alerts' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  schedule-probe:
    if: ${{ github.event_name == 'schedule' && (github.event.schedule == '59 5 30 10 *' || github.event.schedule == '9 6 30 10 *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record scheduled trigger without scanning or email
        env:
          PROBE_EVENT: ${{ github.event_name }}
          PROBE_CRON: ${{ github.event.schedule }}
          PROBE_ACTOR: ${{ github.actor }}
          PROBE_SHA: ${{ github.sha }}
          PROBE_RUN_ID: ${{ github.run_id }}
          PROBE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$PROBE_EVENT" = "schedule"
          printf 'probe_event=%s\nprobe_cron=%s\nprobe_actor=%s\nprobe_sha=%s\nprobe_run_id=%s\nprobe_ref=%s\n' "$PROBE_EVENT" "$PROBE_CRON" "$PROBE_ACTOR" "$PROBE_SHA" "$PROBE_RUN_ID" "$PROBE_REF"
          date -u +"probe_observed_at=%Y-%m-%dT%H:%M:%SZ"
          {
            printf '## Schedule trigger verification\n\n'
            printf 'Event: `%s`\n\nCron: `%s`\n\nActor: `%s`\n\nCommit: `%s`\n\nRun ID: `%s`\n\n' "$PROBE_EVENT" "$PROBE_CRON" "$PROBE_ACTOR" "$PROBE_SHA" "$PROBE_RUN_ID"
            printf 'This job does not scan announcements, load email secrets, or send email.\n'
          } >> "$GITHUB_STEP_SUMMARY"
  bid-alerts:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && (github.event.schedule == '17 1 * * *' || github.event.schedule == '47 9 * * *')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TZ: Asia/Shanghai
      RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'scan' }}
      BID_ALERT_KEYWORDS: "专家咨询采购,专家咨询采购项目,专家咨询服务,专家咨询服务采购,专家咨询服务供应商入围采购,专家咨询服务招标,专家咨询服务选聘,行业专家咨询服务采购,外部专家咨询服务,专家访谈咨询服务,专家服务选型,专家服务供应商入围,专家咨询库,咨询中介机构"
      BID_ALERT_SITE_FILTERS: "ctbpsp.com,cebpubservice.com,sdicc.com.cn,gy.chinamae.com,ctsec.com,eps.qdgxjt.com,stbid.stdzzb.com,bbda.com,epp.sinomach.com.cn,jzcg.chinagoldgroup.com,supplier.gtht.com,ec.chng.com.cn,bidding.ec.chng.com.cn,yuxinec.com,sntba.com,jszbtb.com"
      BID_ALERT_EXTRA_QUERIES: "专家咨询采购项目;专家咨询采购 招标公告;专家咨询服务采购 入围;专家咨询服务采购 候选人公示;专家咨询服务采购 结果公告;专家咨询服务采购 更正公告;专家咨询服务框架协议;专家咨询服务供应商;专家咨询服务供应商入围采购;专家咨询服务招标;专家咨询服务选聘;外部专家咨询服务;外部专家咨询服务采购;外部专家咨询服务选聘;行业专家咨询服务采购;专家访谈咨询服务;专家服务选型;专家服务供应商入围;证券 专家咨询服务采购;证券 专家咨询服务供应商;证券 外部专家咨询服务;股权投资 专家咨询服务采购;私募基金 专家咨询服务;私募基金 专家访谈咨询服务;基金管理 专家咨询服务"
      BID_ALERT_SOURCE_URLS: "https://www.sdicc.com.cn/,https://gy.chinamae.com/purchases-latest,https://gy.chinamae.com/purchases/type/1,https://gy.chinamae.com/purchases/type/3,https://www.ctsec.com/bidding,https://www.ctsec.com/bidding/list/1,https://www.ctsec.com/bidding/list/2,https://www.ctsec.com/bidding/list/3,https://eps.qdgxjt.com/cms/channel/xmgg1qb/index.htm,https://eps.qdgxjt.com/cms/channel/xmgg1qb/index.htm?pageNo=2,https://eps.qdgxjt.com/cms/channel/xmgg1qb/index.htm?pageNo=3,https://eps.qdgxjt.com/cms/channel/xmgg2qb/index.htm,https://eps.qdgxjt.com/cms/channel/xmgg2qb/index.htm?pageNo=2,https://eps.qdgxjt.com/cms/channel/xmgg2qb/index.htm?pageNo=3,https://eps.qdgxjt.com/cms/channel/xmgg3qb/index.htm,https://eps.qdgxjt.com/cms/channel/xmgg3qb/index.htm?pageNo=2,https://eps.qdgxjt.com/cms/channel/xmgg3qb/index.htm?pageNo=3,https://eps.qdgxjt.com/cms/channel/xmgg4qb/index.htm,https://eps.qdgxjt.com/cms/channel/xmgg4qb/index.htm?pageNo=2,https://eps.qdgxjt.com/cms/channel/xmgg4qb/index.htm?pageNo=3"
      BID_ALERT_QUERY_SUFFIX: "after:2025-01-01"
      BID_ALERT_BROAD_SEARCH: "true"
      BID_ALERT_CTBPSP_MIRROR_SEARCH: "true"
      BID_ALERT_CTBPSP_MIRROR_SITE_FILTERS: "sdicc.com.cn,gy.chinamae.com,stbid.stdzzb.com,ctsec.com,bbda.com,epp.sinomach.com.cn,jzcg.chinagoldgroup.com,supplier.gtht.com,ec.chng.com.cn,bidding.ec.chng.com.cn,yuxinec.com,sntba.com,jszbtb.com"
      BID_ALERT_CTBPSP_MIRROR_MAX_ITEMS: "3"
      BID_ALERT_STATE_FILE: "work/bid-alerts/state.json"
      BID_ALERT_MAX_RESULTS_PER_QUERY: "50"
      BID_ALERT_BROKER_COVERAGE: "true"
      BID_ALERT_BROKER_REGISTRY: "data/bid-alerts/brokers.json"
      BID_ALERT_FETCH_DETAILS: "true"
      BID_ALERT_FETCH_WORKERS: "4"
      BID_ALERT_SOURCE_MAX_PAGES: "5"
      BID_ALERT_MAX_DETAIL_PAGES: "500"
      BID_ALERT_SCAN_BUDGET_SECONDS: "3600"
      BID_ALERT_REPORT_FILE: "work/bid-alerts/coverage-report.json"
      BID_ALERT_MIN_RELEVANCE_SCORE: "5"
      BID_ALERT_MAX_EMAIL_ITEMS: "50"
      BID_ALERT_REQUEST_TIMEOUT_SECONDS: "20"
      BID_ALERT_SUBJECT_PREFIX: "招标公告提醒"
      BID_ALERT_SMTP_HOST: "smtp.gmail.com"
      BID_ALERT_SMTP_PORT: "465"
      BID_ALERT_SMTP_USE_SSL: "true"
      BID_ALERT_SMTP_USE_TLS: "false"
      BID_ALERT_RECIPIENT_EMAIL: ${{ secrets.BID_ALERT_RECIPIENT_EMAIL }}
      BID_ALERT_SENDER_EMAIL: ${{ secrets.BID_ALERT_SENDER_EMAIL }}
      BID_ALERT_SMTP_USERNAME: ${{ secrets.BID_ALERT_SMTP_USERNAME }}
      BID_ALERT_SMTP_PASSWORD: ${{ secrets.BID_ALERT_SMTP_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: work/bid-alerts
          key: bid-alert-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bid-alert-state-

      - name: Ensure state directory exists
        run: mkdir -p work/bid-alerts

      - name: Build broker coverage plan
        run: python -m src.bid_alerts --coverage-plan --report-file work/bid-alerts/coverage-plan.json

      - name: Check email secrets
        if: ${{ env.RUN_MODE == 'scan' || env.RUN_MODE == 'test-email' }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            BID_ALERT_RECIPIENT_EMAIL \
            BID_ALERT_SENDER_EMAIL \
            BID_ALERT_SMTP_USERNAME \
            BID_ALERT_SMTP_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Run bid alert
        run: |
          set -euo pipefail
          mode="${RUN_MODE:-scan}"
          case "${mode}" in
            scan)
              python -m src.bid_alerts --verbose
              ;;
            dry-run)
              python -m src.bid_alerts --dry-run --verbose
              ;;
            test-email)
              python -m src.bid_alerts --test-email
              ;;
            prime)
              python -m src.bid_alerts --prime --verbose
              ;;
            *)
              echo "Unsupported mode: ${mode}" >&2
              exit 2
              ;;
          esac

      - name: Save alert state
        if: ${{ always() && (env.RUN_MODE == 'scan' || env.RUN_MODE == 'prime') }}
        uses: actions/cache/save@v4
        with:
          path: work/bid-alerts
          key: bid-alert-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bid-alert-coverage-${{ github.run_id }}
          path: |
            work/bid-alerts/coverage-plan.json
            work/bid-alerts/coverage-report.json
          if-no-files-found: warn
          retention-days: 30

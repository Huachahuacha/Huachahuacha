name: Bid announcement alerts

on:
  schedule:
    # 09:17 Asia/Shanghai = 01:17 UTC. Avoid the busy top-of-hour scheduler window.
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "scan"
        type: choice
        options:
          - scan
          - dry-run
          - test-email
          - prime

concurrency:
  group: bid-announcement-alerts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bid-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TZ: Asia/Shanghai
      RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'scan' }}
      BID_ALERT_KEYWORDS: "专家咨询服务,专家咨询服务采购,专家咨询服务供应商入围采购,专家咨询服务招标,专家咨询服务选聘,行业专家咨询服务采购,外部专家咨询服务,专家访谈咨询服务,专家服务选型,专家服务供应商入围,专家咨询库,咨询中介机构"
      BID_ALERT_SITE_FILTERS: "ctbpsp.com,cebpubservice.com,sdicc.com.cn,gy.chinamae.com,ctsec.com,stbid.stdzzb.com,bbda.com,epp.sinomach.com.cn,jzcg.chinagoldgroup.com,supplier.gtht.com,ec.chng.com.cn,bidding.ec.chng.com.cn,yuxinec.com,sntba.com,jszbtb.com"
      BID_ALERT_EXTRA_QUERIES: "专家咨询服务采购 入围;专家咨询服务采购 候选人公示;专家咨询服务采购 结果公告;专家咨询服务采购 更正公告;专家咨询服务框架协议;专家咨询服务供应商;专家咨询服务供应商入围采购;专家咨询服务招标;专家咨询服务选聘;外部专家咨询服务;外部专家咨询服务采购;外部专家咨询服务选聘;行业专家咨询服务采购;专家访谈咨询服务;专家服务选型;专家服务供应商入围;证券 专家咨询服务采购;证券 专家咨询服务供应商;证券 外部专家咨询服务;股权投资 专家咨询服务采购;私募基金 专家咨询服务;私募基金 专家访谈咨询服务;基金管理 专家咨询服务"
      BID_ALERT_SOURCE_URLS: "https://www.sdicc.com.cn/,https://gy.chinamae.com/purchases-latest,https://gy.chinamae.com/purchases/type/1,https://gy.chinamae.com/purchases/type/3,https://www.ctsec.com/bidding,https://www.ctsec.com/bidding/list/1,https://www.ctsec.com/bidding/list/2,https://www.ctsec.com/bidding/list/3"
      BID_ALERT_QUERY_SUFFIX: "after:2025-01-01"
      BID_ALERT_BROAD_SEARCH: "true"
      BID_ALERT_CTBPSP_MIRROR_SEARCH: "true"
      BID_ALERT_CTBPSP_MIRROR_SITE_FILTERS: "sdicc.com.cn,gy.chinamae.com,stbid.stdzzb.com,ctsec.com,bbda.com,epp.sinomach.com.cn,jzcg.chinagoldgroup.com,supplier.gtht.com,ec.chng.com.cn,bidding.ec.chng.com.cn,yuxinec.com,sntba.com,jszbtb.com"
      BID_ALERT_CTBPSP_MIRROR_MAX_ITEMS: "3"
      BID_ALERT_STATE_FILE: "work/bid-alerts/state.json"
      BID_ALERT_MAX_RESULTS_PER_QUERY: "5"
      BID_ALERT_MIN_RELEVANCE_SCORE: "5"
      BID_ALERT_MAX_EMAIL_ITEMS: "50"
      BID_ALERT_REQUEST_TIMEOUT_SECONDS: "20"
      BID_ALERT_SUBJECT_PREFIX: "招标公告提醒"
      BID_ALERT_SMTP_HOST: "smtp.gmail.com"
      BID_ALERT_SMTP_PORT: "465"
      BID_ALERT_SMTP_USE_SSL: "true"
      BID_ALERT_SMTP_USE_TLS: "false"
      BID_ALERT_RECIPIENT_EMAIL: ${{ secrets.BID_ALERT_RECIPIENT_EMAIL }}
      BID_ALERT_SENDER_EMAIL: ${{ secrets.BID_ALERT_SENDER_EMAIL }}
      BID_ALERT_SMTP_USERNAME: ${{ secrets.BID_ALERT_SMTP_USERNAME }}
      BID_ALERT_SMTP_PASSWORD: ${{ secrets.BID_ALERT_SMTP_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: work/bid-alerts
          key: bid-alert-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bid-alert-state-

      - name: Ensure state directory exists
        run: mkdir -p work/bid-alerts

      - name: Check email secrets
        if: ${{ env.RUN_MODE == 'scan' || env.RUN_MODE == 'test-email' }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            BID_ALERT_RECIPIENT_EMAIL \
            BID_ALERT_SENDER_EMAIL \
            BID_ALERT_SMTP_USERNAME \
            BID_ALERT_SMTP_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Run bid alert
        run: |
          set -euo pipefail
          mode="${RUN_MODE:-scan}"
          case "${mode}" in
            scan)
              python -m src.bid_alerts --verbose
              ;;
            dry-run)
              python -m src.bid_alerts --dry-run --verbose
              ;;
            test-email)
              python -m src.bid_alerts --test-email
              ;;
            prime)
              python -m src.bid_alerts --prime --verbose
              ;;
            *)
              echo "Unsupported mode: ${mode}" >&2
              exit 2
              ;;
          esac

      - name: Save alert state
        if: ${{ success() && (env.RUN_MODE == 'scan' || env.RUN_MODE == 'prime') }}
        uses: actions/cache/save@v4
        with:
          path: work/bid-alerts
          key: bid-alert-state-${{ github.run_id }}-${{ github.run_attempt }}
